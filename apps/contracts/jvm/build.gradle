plugins {
    id 'java-library'
    id 'com.google.protobuf' version '0.9.4'
}
repositories { mavenCentral() }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
sourceSets { main { proto { srcDir '../../../docs/api/proto' } } }
dependencies {
    api 'com.google.protobuf:protobuf-java:3.25.5'
    api 'io.grpc:grpc-protobuf:1.70.0'
    api 'io.grpc:grpc-stub:1.70.0'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
}
protobuf {
    protoc { artifact = 'com.google.protobuf:protoc:3.25.5' }
    plugins { grpc { artifact = 'io.grpc:protoc-gen-grpc-java:1.70.0' } }
    generateProtoTasks { all().configureEach { plugins { grpc {} } } }
}
dependencyLocking { lockAllConfigurations() }
