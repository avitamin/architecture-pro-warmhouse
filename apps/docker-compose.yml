services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a nonempty POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - smarthome-network
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U postgres -d smarthome -v ON_ERROR_STOP=1 -c 'SELECT 1 FROM sensors LIMIT 0' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  temperature-api:
    build:
      context: ./temperature-api
    ports:
      - "${TEMPERATURE_API_PORT:-8081}:8081"
    networks:
      - smarthome-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  app:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: smarthome-app
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres@postgres:5432/smarthome
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set a nonempty POSTGRES_PASSWORD in .env}
      TEMPERATURE_API_URL: http://temperature-api:8081
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped
    networks:
      - smarthome-network

volumes:
  postgres_data:

networks:
  smarthome-network:
    driver: bridge
