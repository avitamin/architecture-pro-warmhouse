            value: csrf-token-from-session
      responses:
        '202':
          description: Принята к обработке; выполнение не подтверждено
          content:
            application/json:
              schema:
                $ref: ./schemas.json#/definitions/Command
              examples:
                normal:
                  value: &id001
                    command_id: cmd-manual-1
                    capability_id: cap-heating
                    parameters: &id002
                      operation: set
                      arguments:
                        enabled: true
                    expires_at: '2026-10-21T10:00:30Z'
                    device_id: dev-thermostat
                    user_id: user-1
                    source: manual
                    created_at: '2026-10-21T10:00:05Z'
                    status: accepted
                    acceptance_seq: '41'
          headers:
            Location:
              schema:
                type: string
              description: URI чтения команды
        '200':
          description: Повтор идентичного ранее принятого запроса; текущее состояние без нового задания
          content:
            application/json:
              schema:
                $ref: ./schemas.json#/definitions/Command
              examples:
