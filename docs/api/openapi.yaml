openapi: 3.1.1
info:
  title: 'Умный дом: телеметрия и управление'
  version: 1.0.0
  description: 'Проектируемый API. Реализации нет. Семантика, ошибки, gRPC и сценарии: README.md и contracts.md.'
servers:
- url: https://api.warmhouse.example/api/v1
  description: Документационный адрес; сервер не развёрнут
security:
- session: []
tags:
- name: Devices
  description: Устройства, история и команды
- name: Scenarios
  description: Правила и срабатывания
paths:
  /devices/{device_id}:
    get:
      operationId: getDevice
      summary: Получить устройство и его возможности
      tags:
      - Devices
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          $ref: ./schemas.json#/definitions/Id
        description: Идентификатор ресурса
        examples:
          normal:
            value: dev-thermostat
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: ./schemas.json#/definitions/Device
              examples:
                normal:
                  value:
                    id: dev-thermostat
                    house_id: house-home
                    type_id: type-thermostat
                    name: Термостат гостиной
                    registration_status: bound
                    capabilities:
                    - id: cap-temperature
                      code: temperature
                      kind: measurement
                      value_type: number
                      unit: Cel
                    - id: cap-heating
                      code: heating
                      kind: control
                      parameters_schema:
                        type: object
                        additionalProperties: false
                        properties:
                          operation:
                            const: set
                          arguments:
                            type: object
                            additionalProperties: false
                            properties:
                              enabled:
                                type: boolean
                            required:
                            - enabled
                        required:
                        - operation
                        - arguments
        '400':
          description: Некорректный JSON или параметры
          content:
            application/json:
              schema:
                $ref: ./schemas.json#/definitions/Error
              examples:
                normal:
                  value:
                    code: INVALID_ARGUMENT
                    message: Некорректный JSON или параметры
                    retryable: false
                    request_id: req-1
        '401':
          description: Сессия недействительна
          content:
            application/json:
              schema:
                $ref: ./schemas.json#/definitions/Error
              examples:
                normal:
                  value:
                    code: UNAUTHENTICATED
                    message: Сессия недействительна
                    retryable: false
                    request_id: req-1
        '403':
          description: Нет доступа или CSRF-проверка не пройдена
          content:
            application/json:
              schema:
                $ref: ./schemas.json#/definitions/Error
              examples:
                normal:
                  value:
                    code: PERMISSION_DENIED
                    message: Нет доступа или CSRF-проверка не пройдена
                    retryable: false
                    request_id: req-1
        '404':
          description: Ресурс не найден
          content:
            application/json:
              schema:
                $ref: ./schemas.json#/definitions/Error
              examples:
                normal:
                  value:
                    code: NOT_FOUND
                    message: Ресурс не найден
                    retryable: false
                    request_id: req-1
        '500':
          description: Внутренняя ошибка
          content:
            application/json:
              schema:
                $ref: ./schemas.json#/definitions/Error
              examples:
                normal:
                  value:
                    code: INTERNAL
                    message: Внутренняя ошибка
                    retryable: false
                    request_id: req-1
        '503':
          description: Зависимость временно недоступна
          content:
            application/json:
              schema:
                $ref: ./schemas.json#/definitions/Error
              examples:
                normal:
                  value:
                    code: UNAVAILABLE
                    message: Зависимость временно недоступна
                    retryable: true
                    request_id: req-1
        '504':
          description: Результат запроса неизвестен из-за таймаута
          content:
            application/json:
              schema:
                $ref: ./schemas.json#/definitions/Error
              examples:
                normal:
                  value:
                    code: DEADLINE_EXCEEDED
                    message: Результат запроса неизвестен из-за таймаута
                    retryable: true
                    request_id: req-1
  /devices/{device_id}/telemetry:
    get:
      operationId: listTelemetry
      summary: Прочитать сохранённую историю, без опроса оборудования
      tags:
      - Devices
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          $ref: ./schemas.json#/definitions/Id
        description: Идентификатор ресурса
        examples:
          normal:
            value: dev-thermostat
      - name: capability_id
        in: query
        required: false
        schema:
          $ref: ./schemas.json#/definitions/Id
        description: Возможность этого устройства
        examples:
          normal:
            value: cap-temperature
      - name: from
        in: query
        required: false
        schema:
          $ref: ./schemas.json#/definitions/Instant
        description: Включительная нижняя граница measured_at
        examples:
          normal:
            value: '2026-10-21T10:00:00Z'
      - name: to
        in: query
        required: false
        schema:
          $ref: ./schemas.json#/definitions/Instant
        description: Исключительная верхняя граница measured_at
        examples:
          normal:
            value: '2026-10-21T11:00:00Z'
      - &id003
        name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
        description: Размер страницы
        examples:
          normal:
            value: 100
      - &id004
        name: cursor
        in: query
        required: false
        schema:
          type: string
        description: Непрозрачный курсор из предыдущего ответа; привязан к фильтрам и пользователю
        examples:
          normal:
            value: opaque-cursor-from-previous-page
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: ./schemas.json#/definitions/TelemetryPage
              examples:
                normal:
                  value:
                    items:
                    - id: measurement-1
                      event_id: evt-measurement-1
                      device_id: dev-thermostat
                      capability_id: cap-temperature
                      value: 17
                      measured_at: '2026-10-21T10:00:01Z'
                      gateway_received_at: '2026-10-21T10:00:02Z'
                      unit: Cel
        '400':
          description: Некорректный JSON или параметры
          content:
            application/json:
              schema:
                $ref: ./schemas.json#/definitions/Error
              examples:
                normal:
                  value:
                    code: INVALID_ARGUMENT
                    message: Некорректный JSON или параметры
                    retryable: false
                    request_id: req-1
        '401':
          description: Сессия недействительна
          content:
            application/json:
              schema:
                $ref: ./schemas.json#/definitions/Error
              examples:
                normal:
                  value:
