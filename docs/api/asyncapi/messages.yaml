components:
  messages:
    PollRequested:
      name: PollRequested
      title: poll.requested
      contentType: application/json
      correlationId:
        location: $message.payload#/poll_job_id
      payload:
        $ref: ../schemas.json#/definitions/PollRequested
      examples:
      - name: normal
        summary: Сквозной пример; сроки иллюстративные
        payload:
          event_id: evt-poll-request-1
          type: poll.requested
          schema_version: 1
          occurred_at: '2026-10-21T10:00:00Z'
          poll_job_id: poll-1
          device_id: dev-thermostat
          capability_id: cap-temperature
          expires_at: '2026-10-21T10:00:10Z'
          config:
            device_id: dev-thermostat
            capability_id: cap-temperature
            config_version: 1
            adapter_key: partner-thermostat
            endpoint_key: registered-endpoint-1
            channel: temperature
            issued_at: '2026-10-21T10:00:00Z'
            valid_until: '2026-10-21T10:05:00Z'
            value_type: number
            unit: Cel
    PollCompleted:
      name: PollCompleted
      title: poll.completed
      contentType: application/json
      correlationId:
        location: $message.payload#/poll_job_id
      payload:
        $ref: ../schemas.json#/definitions/PollCompleted
      examples:
      - name: normal
        summary: Сквозной пример; сроки иллюстративные
        payload:
          event_id: evt-poll-result-1
          type: poll.completed
          schema_version: 1
          occurred_at: '2026-10-21T10:00:02Z'
          poll_job_id: poll-1
          device_id: dev-thermostat
          capability_id: cap-temperature
          outcome: succeeded
          measurement_event_id: evt-measurement-1
      - name: timeout
        payload:
          event_id: evt-poll-result-timeout
          type: poll.completed
          schema_version: 1
          occurred_at: '2026-10-21T10:00:02Z'
          poll_job_id: poll-2
          device_id: dev-thermostat
          capability_id: cap-temperature
          outcome: timeout
          reason_code: DEVICE_TIMEOUT
    MeasurementRecorded:
      name: MeasurementRecorded
      title: measurement.recorded
      contentType: application/json
      correlationId:
        location: $message.payload#/poll_job_id
      payload:
        $ref: ../schemas.json#/definitions/MeasurementRecorded
      examples:
      - name: normal
        summary: Сквозной пример; сроки иллюстративные
        payload:
          event_id: evt-measurement-1
          type: measurement.recorded
          schema_version: 1
          occurred_at: '2026-10-21T10:00:02Z'
          device_id: dev-thermostat
          capability_id: cap-temperature
          value: 17
          measured_at: '2026-10-21T10:00:01Z'
          gateway_received_at: '2026-10-21T10:00:02Z'
          unit: Cel
          poll_job_id: poll-1
    CommandRequested:
      name: CommandRequested
      title: command.requested
      contentType: application/json
      correlationId:
        location: $message.payload#/command_id
      payload:
        $ref: ../schemas.json#/definitions/CommandRequested
      examples:
      - name: normal
        summary: Сквозной пример; сроки иллюстративные
        payload:
          event_id: evt-command-request-1
          type: command.requested
          schema_version: 1
          occurred_at: '2026-10-21T10:00:03Z'
          command_id: cmd-auto-1
          device_id: dev-thermostat
          capability_id: cap-heating
          user_id: user-1
          source: scenario
          parameters:
            operation: set
            arguments:
              enabled: true
          acceptance_seq: '40'
          expires_at: '2026-10-21T10:00:33Z'
          config:
            device_id: dev-thermostat
            capability_id: cap-heating
            config_version: 1
            adapter_key: partner-thermostat
            endpoint_key: registered-endpoint-1
            channel: heating
            issued_at: '2026-10-21T10:00:00Z'
            valid_until: '2026-10-21T10:05:00Z'
          rule_id: rule-heat
          rule_version: 1
          trigger_id: trigger-1
          causation_event_id: evt-measurement-1
      - name: manual
        payload:
          event_id: evt-command-manual
          type: command.requested
          schema_version: 1
          occurred_at: '2026-10-21T10:00:05Z'
          command_id: cmd-manual-1
          device_id: dev-thermostat
          capability_id: cap-heating
          user_id: user-1
          source: manual
          parameters:
            operation: set
            arguments:
              enabled: true
          acceptance_seq: '41'
          expires_at: '2026-10-21T10:00:30Z'
          config:
            device_id: dev-thermostat
            capability_id: cap-heating
            config_version: 1
            adapter_key: partner-thermostat
            endpoint_key: registered-endpoint-1
            channel: heating
            issued_at: '2026-10-21T10:00:00Z'
            valid_until: '2026-10-21T10:05:00Z'
          manual_cancel_before_seq: '41'
    CommandStateChanged:
      name: CommandStateChanged
      title: command.state_changed
      contentType: application/json
      correlationId:
        location: $message.payload#/command_id
      payload:
        $ref: ../schemas.json#/definitions/CommandStateChanged
      examples:
      - name: normal
        summary: Сквозной пример; сроки иллюстративные
        payload:
          event_id: evt-command-result-3
          type: command.state_changed
          schema_version: 1
          occurred_at: '2026-10-21T10:00:04Z'
          command_id: cmd-auto-1
          device_id: dev-thermostat
          capability_id: cap-heating
          result_version: '3'
          status: succeeded
          state_changed_at: '2026-10-21T10:00:04Z'
          reason_code: COMPLETED
          evidence: operation_completed
      - name: unknown
        payload:
          event_id: evt-command-unknown-2
          type: command.state_changed
          schema_version: 1
          occurred_at: '2026-10-21T10:00:06Z'
          command_id: cmd-auto-unknown-1
          device_id: dev-thermostat
          capability_id: cap-heating
          result_version: '2'
          status: unknown
          state_changed_at: '2026-10-21T10:00:06Z'
          reason_code: RESPONSE_LOST
          evidence: none
        summary: 'Отдельный сценарий: sent версии 1 не показан, исход пока неизвестен'
      - name: queued
        payload:
          event_id: evt-command-queued
          type: command.state_changed
          schema_version: 1
          occurred_at: '2026-10-21T10:00:03Z'
          command_id: cmd-auto-1
          device_id: dev-thermostat
          capability_id: cap-heating
          result_version: '1'
          status: queued
          state_changed_at: '2026-10-21T10:00:03Z'
          reason_code: QUEUED
          evidence: none
      - name: sent
        payload:
          event_id: evt-command-sent
          type: command.state_changed
          schema_version: 1
          occurred_at: '2026-10-21T10:00:04Z'
          command_id: cmd-auto-1
          device_id: dev-thermostat
          capability_id: cap-heating
          result_version: '2'
          status: sent
          state_changed_at: '2026-10-21T10:00:04Z'
          reason_code: SENT
          evidence: none
